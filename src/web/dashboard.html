<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NileOps | لوحة العمليات</title>
  <link rel="stylesheet" href="/dashboard/style.css">
</head>
<body>
  <a class="skip" href="#view">تخطَّ إلى المحتوى</a>
  <header class="topbar">
    <div class="brand"><span class="logo" aria-hidden="true">N</span><div><h1>NileOps</h1><p>مساعد العمليات البنكية</p></div></div>
    <div class="session" id="session" hidden>
      <span id="who"></span>
      <button type="button" id="refresh" class="ghost">تحديث</button>
      <button type="button" id="logout" class="ghost">تسجيل الخروج</button>
    </div>
  </header>
  <div class="banner" role="note">بيانات اصطناعية للتجربة. الذكاء الاصطناعي والقراءة الآلية يساعدان فقط، والقرار النهائي للموظف. <span id="role-note"></span></div>

  <div class="layout">
    <nav id="nav" class="nav" aria-label="أقسام النظام"></nav>
    <main>
      <section id="login" class="card narrow">
        <h2>تسجيل الدخول</h2>
        <form id="login-form" autocomplete="off">
          <label for="username">اسم المستخدم</label>
          <input id="username" name="username" required autocomplete="username" dir="ltr">
          <label for="password">كلمة المرور</label>
          <input id="password" name="password" type="password" required autocomplete="current-password" dir="ltr">
          <button type="submit" class="primary">دخول</button>
          <p id="login-error" class="error" role="alert" hidden></p>
        </form>
      </section>
      <section id="app" hidden><div id="view" class="view" tabindex="-1"></div></section>
    </main>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="/dashboard/app.js"></script>
</body>
</html>
